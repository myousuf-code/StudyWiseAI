<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="aiBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square background -->
  <rect x="0" y="4" width="72" height="72" rx="14" fill="url(#iconGrad)"/>

  <!-- Neural network icon — 5 nodes, clean lines -->
  <!-- Connection lines (drawn first, behind nodes) -->
  <line x1="36" y1="40" x2="18" y2="24" stroke="white" stroke-width="1.4" opacity="0.45"/>
  <line x1="36" y1="40" x2="54" y2="24" stroke="white" stroke-width="1.4" opacity="0.45"/>
  <line x1="36" y1="40" x2="18" y2="56" stroke="white" stroke-width="1.4" opacity="0.45"/>
  <line x1="36" y1="40" x2="54" y2="56" stroke="white" stroke-width="1.4" opacity="0.45"/>
  <line x1="18" y1="24" x2="54" y2="24" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="18" y1="56" x2="54" y2="56" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="18" y1="24" x2="18" y2="56" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="54" y1="24" x2="54" y2="56" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- Nodes -->
  <circle cx="36" cy="40" r="5.5" fill="white"/>
  <circle cx="18" cy="24" r="3.8" fill="white" opacity="0.92"/>
  <circle cx="54" cy="24" r="3.8" fill="white" opacity="0.92"/>
  <circle cx="18" cy="56" r="3.8" fill="white" opacity="0.92"/>
  <circle cx="54" cy="56" r="3.8" fill="white" opacity="0.92"/>

  <!-- Wordmark: StudyWise -->
  <text x="90" y="46"
        font-family="'Segoe UI', 'SF Pro Display', -apple-system, Arial, sans-serif"
        font-size="26"
        font-weight="700"
        letter-spacing="-0.8"
        fill="#1e1b4b">StudyWise</text>

  <!-- AI badge pill -->
  <rect x="90" y="54" width="34" height="16" rx="5" fill="url(#aiBadge)"/>
  <text x="107" y="66"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="1.5"
        fill="white"
        text-anchor="middle">AI</text>
</svg>
